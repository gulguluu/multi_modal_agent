services:
  vision-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vision
    pull_policy: never
    image: mcp-vision-server:latest
    container_name: mcp-vision-server
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data  # For image files
      - vision-cache:/app/.cache  # For model cache
    privileged: true
    devices:
      - /dev/dri:/dev/dri
    environment:
      - IPEX_OPTIMIZE=1
      - IPEX_MERGE_FUSION=1
      - IPEX_AUTO_TUNE=1
    restart: unless-stopped
    networks:
      - mcp-network

  llm-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.llm
    pull_policy: never
    image: mcp-llm-server:latest
    container_name: mcp-llm-server
    ports:
      - "8001:8001"
    volumes:
      - llm-cache:/app/.cache  # For model cache
      - llm-models:/app/models  # For model files
    privileged: true
    devices:
      - /dev/dri:/dev/dri
    environment:
      - IPEX_OPTIMIZE=1
      - IPEX_MERGE_FUSION=1
      - IPEX_AUTO_TUNE=1
      - TRANSFORMERS_CACHE=/app/models
      - HUGGINGFACE_CACHE_DIR=/app/models
    restart: unless-stopped
    networks:
      - mcp-network

  search-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.search
    pull_policy: never
    image: mcp-search-server:latest
    container_name: mcp-search-server
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - mcp-network

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    pull_policy: never
    image: mcp-client:latest
    container_name: mcp-client
    profiles: [manual]
    depends_on:
      - vision-server
      - llm-server
      - search-server
    volumes:
      - ../data:/app/data 
    environment:
      - VISION_SERVER_URL=http://vision-server:8000
      - LLM_SERVER_URL=http://llm-server:8001
      - SEARCH_SERVER_URL=http://search-server:8002
    networks:
      - mcp-network

volumes:
  vision-cache:
  llm-cache:
  llm-models:

networks:
  mcp-network:
    driver: bridge
